name: swifly
description: A fast, clean social media app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  lucide_icons_flutter: any
  ffi: any
  emoji_picker_flutter: ^2.1.0
  wechat_assets_picker: ^9.1.0
  photo_manager: ^3.3.0
  video_player: ^2.9.2
  visibility_detector: ^0.4.0+2
  path_provider: ^2.1.4
  geolocator: ^13.0.2
  supabase_flutter: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true



