name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (SDK cached)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Dart pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-v1
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name swifly --org com.example .
          fi

      - name: Set app name to Swifly
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Swifly"/' android/app/src/main/AndroidManifest.xml

      - name: Install CMake for the C++ core
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" > /dev/null || true

      - name: Wire C++ core into the Android build
        run: |
          mkdir -p android/app/src/main/cpp
          cp cpp/CMakeLists.txt cpp/swifly_core.cpp android/app/src/main/cpp/
          python3 - << 'PY'
          import os
          path = None
          for name in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              if os.path.exists(name):
                  path = name
                  break
          src = open(path).read()
          if "externalNativeBuild" not in src:
              if path.endswith(".kts"):
                  block = ('    externalNativeBuild {\n'
                           '        cmake {\n'
                           '            path = file("src/main/cpp/CMakeLists.txt")\n'
                           '            version = "3.22.1"\n'
                           '        }\n'
                           '    }\n')
              else:
                  block = ('    externalNativeBuild {\n'
                           '        cmake {\n'
                           '            path "src/main/cpp/CMakeLists.txt"\n'
                           '            version "3.22.1"\n'
                           '        }\n'
                           '    }\n')
              src = src.replace("android {\n", "android {\n" + block, 1)
              open(path, "w").write(src)
          print("C++ core wired into", path)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK (arm64, obfuscated)
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: swifly-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
